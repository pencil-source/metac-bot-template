name: Validate PencilForecast history audit offline

on:
  pull_request:
    paths:
      - "research/history_scoring.py"
      - "research/test_history_scoring.py"
      - ".github/workflows/forecastlab_history.yml"
      - ".github/workflows/forecastlab_history_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m py_compile research/history_scoring.py research/test_history_scoring.py
          python -m unittest discover -s research -p "test_history_scoring.py" -v
